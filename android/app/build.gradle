plugins { id 'com.android.application' }

def ks = System.getenv("DESTROY_KEYSTORE")   // percorso del keystore (creato dal workflow dai Secrets)

android {
    namespace 'com.nabbinator.destroy'
    compileSdk 36
    defaultConfig {
        applicationId 'com.nabbinator.destroy'
        minSdk 24
        targetSdk 36
        versionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName = (System.getenv("VERSION_NAME") ?: "1.0")
    }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("DESTROY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DESTROY_KEY_ALIAS")
                keyPassword System.getenv("DESTROY_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.android.billingclient:billing:8.0.0'
}
