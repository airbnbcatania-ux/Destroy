name: App Android

# Costruisce l'app Android di "Destroy: battili tutti!":
#  - un file AAB da caricare sul Play Store
#  - un APK da installare sul telefono per provarla
# Parte da sola quando aggiorni index.html, oppure a mano da Actions -> App Android -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'index.html', '.github/workflows/android.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

   

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Crea il progetto Android
        run: |
          mkdir -p "android/."
          cat > "android/settings.gradle" <<'EOF_DESTROY'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Destroy"
          include ':app'
          EOF_DESTROY
          mkdir -p "android/."
          cat > "android/build.gradle" <<'EOF_DESTROY'
          plugins { id 'com.android.application' version '8.10.1' apply false }
          EOF_DESTROY
          mkdir -p "android/."
          cat > "android/gradle.properties" <<'EOF_DESTROY'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_DESTROY
          mkdir -p "android/app"
          cat > "android/app/build.gradle" <<'EOF_DESTROY'
          plugins { id 'com.android.application' }

          def ks = System.getenv("DESTROY_KEYSTORE")   // percorso del keystore (creato dal workflow dai Secrets)

          android {
              namespace 'com.nabbinator.destroy'
              compileSdk 36
              defaultConfig {
                  applicationId 'com.nabbinator.destroy'
                  versionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
                  versionName = (System.getenv("VERSION_NAME") ?: "1.0")
                  versionCode (System.getenv("VERSION_CODE") ?: "1").toInteger()
                  versionName (System.getenv("VERSION_NAME") ?: "1.0")
              }
              signingConfigs {
                  release {
                      if (ks) {
                          storeFile file(ks)
                          storePassword System.getenv("DESTROY_KEYSTORE_PASSWORD")
                          keyAlias System.getenv("DESTROY_KEY_ALIAS")
                          keyPassword System.getenv("DESTROY_KEY_PASSWORD")
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      if (ks) signingConfig signingConfigs.release
                  }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              lint { checkReleaseBuilds false; abortOnError false }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:23.6.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF_DESTROY
          mkdir -p "android/app/src/main"
          cat > "android/app/src/main/AndroidManifest.xml" <<'EOF_DESTROY'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:label="Destroy: battili tutti!"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.Destroy"
                  android:hardwareAccelerated="true"
                  android:allowBackup="true"
                  android:networkSecurityConfig="@xml/network_security_config">

                  <!-- ID app AdMob -->
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-2439349628224095~9592810098" />
                  <meta-data android:name="com.google.android.gms.ads.flag.OPTIMIZE_INITIALIZATION" android:value="true" />
                  <meta-data android:name="com.google.android.gms.ads.flag.OPTIMIZE_AD_LOADING" android:value="true" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|screenLayout|uiMode"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_DESTROY
          mkdir -p "android/app/src/main/res/values"
          cat > "android/app/src/main/res/values/themes.xml" <<'EOF_DESTROY'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Destroy" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF_DESTROY
          mkdir -p "android/app/src/main/res/xml"
          cat > "android/app/src/main/res/xml/network_security_config.xml" <<'EOF_DESTROY'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false" />
          </network-security-config>
          EOF_DESTROY
          mkdir -p "android/app/src/main/java/com/nabbinator/destroy"
          cat > "android/app/src/main/java/com/nabbinator/destroy/MainActivity.java" <<'EOF_DESTROY'
          package com.nabbinator.destroy;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.net.ConnectivityManager;
          import android.net.NetworkCapabilities;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.google.android.gms.ads.MobileAds;

          /**
           * Destroy: battili tutti! — contenitore Android del gioco.
           * Carica la versione online (sempre aggiornata, con account, PvP e classifiche);
           * senza connessione usa la copia inclusa nell'app.
           * La WebView è registrata presso Google Mobile Ads, così gli annunci AdMob del gioco funzionano.
           */
          public class MainActivity extends Activity {
              private static final String ONLINE_URL = "https://airbnbcatania-ux.github.io/Destroy/?app=android";
              private static final String OFFLINE_URL = "file:///android_asset/index.html?app=android";
              private WebView web;
              private boolean usedOffline = false;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  setContentView(web);
                  goFullscreen();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false); // musica e intro partono subito
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setAllowFileAccess(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setUserAgentString(s.getUserAgentString() + " DestroyApp/Android");

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest req, WebResourceError err) {
                          if (req.isForMainFrame() && !usedOffline) { usedOffline = true; view.loadUrl(OFFLINE_URL); }
                      }
                  });

                  // Annunci: inizializza AdMob e registra la WebView (API WebView per gli annunci)
                  MobileAds.initialize(this, status -> {});
                  MobileAds.registerWebView(web);

                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else if (isOnline()) web.loadUrl(ONLINE_URL);
                  else { usedOffline = true; web.loadUrl(OFFLINE_URL); }
              }

              private boolean isOnline() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                      NetworkCapabilities nc = cm.getNetworkCapabilities(cm.getActiveNetwork());
                      return nc != null && nc.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET);
                  } catch (Exception e) { return true; }
              }

              private void goFullscreen() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      getWindow().setDecorFitsSystemWindows(false);
                      WindowInsetsController c = getWindow().getInsetsController();
                      if (c != null) {
                          c.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                  }
              }

              @Override public void onWindowFocusChanged(boolean hasFocus) { super.onWindowFocusChanged(hasFocus); if (hasFocus) goFullscreen(); }
              @Override protected void onPause() { super.onPause(); web.onPause(); web.evaluateJavascript("try{R&&!R.over&&(R.paused=true)}catch(e){}", null); }
              @Override protected void onResume() { super.onResume(); web.onResume(); }
              @Override protected void onSaveInstanceState(Bundle out) { super.onSaveInstanceState(out); web.saveState(out); }
              @Override protected void onDestroy() { if (web != null) web.destroy(); super.onDestroy(); }

              // Tasto Indietro: chiude una finestra aperta nel gioco o torna alla Home; altrimenti manda l'app in background
              @Override
              public void onBackPressed() {
                  web.evaluateJavascript(
                      "(function(){try{var m=document.getElementById('ov');if(m&&getComputedStyle(m).display!=='none'&&typeof hideModal==='function'){hideModal();return 1;}" +
                      "if(window.R&&!R.over){R.paused=true;return 1;}if(typeof curScreen!=='undefined'&&curScreen!=='sHome'&&typeof go==='function'){go('sHome');return 1;}}catch(e){}return 0;})()",
                      v -> { if (!"1".equals(v)) moveTaskToBack(true); });
              }
          }
          EOF_DESTROY
          mkdir -p android/app/src/main/res/mipmap-xxhdpi android/app/src/main/assets
          echo '' | base64 -d > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp index.html android/app/src/main/assets/index.html


      - name: Prepara la chiave di firma (dai Secrets del repository)
        env:
          KEYSTORE_B64: ${{ secrets.DESTROY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/destroy.jks"
            echo "DESTROY_KEYSTORE=$RUNNER_TEMP/destroy.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret DESTROY_KEYSTORE_B64 mancante: app senza firma, non caricabile sul Play Store."
          fi

      - name: Costruisci AAB e APK
        env:
          DESTROY_KEYSTORE_PASSWORD: ${{ secrets.DESTROY_KEYSTORE_PASSWORD }}
          DESTROY_KEY_ALIAS: ${{ secrets.DESTROY_KEY_ALIAS }}
          DESTROY_KEY_PASSWORD: ${{ secrets.DESTROY_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle -p android bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Destroy-Play-Store-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Destroy-APK-da-installare
          path: android/app/build/outputs/apk/release/*.apk
