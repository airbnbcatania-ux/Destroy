name: App Android

# Costruisce l'app Android del gioco (AAB per il Play Store + APK da installare sul telefono).
# Parte da sola quando cambi index.html o la cartella android/, oppure a mano da "Actions → App Android → Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'index.html', 'android/**', '.github/workflows/android.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Copia il gioco dentro l'app (versione offline)
        run: cp index.html android/app/src/main/assets/index.html

      - name: Prepara la chiave di firma (dai Secrets del repository)
        env:
          KEYSTORE_B64: ${{ secrets.DESTROY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/destroy.jks"
            echo "DESTROY_KEYSTORE=$RUNNER_TEMP/destroy.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret DESTROY_KEYSTORE_B64 mancante: l'app viene creata senza firma (non caricabile sul Play Store)."
          fi

      - name: Costruisci AAB e APK
        env:
          DESTROY_KEYSTORE_PASSWORD: ${{ secrets.DESTROY_KEYSTORE_PASSWORD }}
          DESTROY_KEY_ALIAS: ${{ secrets.DESTROY_KEY_ALIAS }}
          DESTROY_KEY_PASSWORD: ${{ secrets.DESTROY_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle -p android bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Destroy-Play-Store-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Destroy-APK-da-installare
          path: android/app/build/outputs/apk/release/*.apk
